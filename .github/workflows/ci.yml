
name: CI

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Clone vcpkg
        run: git clone https://github.com/microsoft/vcpkg.git vcpkg

      - name: Bootstrap vcpkg (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: vcpkg\\bootstrap-vcpkg.bat
        shell: cmd

      - name: Install GoogleTest (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./vcpkg/vcpkg install gtest

      - name: Install GoogleTest (Windows)
        if: runner.os == 'Windows'
        run: .\\vcpkg\\vcpkg.exe install gtest
        shell: cmd

      - name: Configure CMake
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Debug
          else
            cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          fi
        shell: bash

      - name: Build
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --build build --config Debug
          else
            cmake --build build --config Release
          fi
        shell: bash

      - name: Run tests
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ctest --test-dir build --output-on-failure -C Debug
          else
            ctest --test-dir build --output-on-failure
          fi
        shell: bash
