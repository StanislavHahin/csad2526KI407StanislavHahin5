name: CI

on:
  push:
    branches: [ main, '**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build wget

      - name: Configure
        run: |
          mkdir -p build
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -C Release
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show cmake & ctest versions
        if: matrix.os != 'windows-latest'
        run: |
          cmake --version || true
          ctest --version || true
        shell: bash

      - name: Show cmake & ctest versions (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cmake --version || true
          ctest --version || true
        shell: pwsh

      - name: Run POSIX script
        if: matrix.os != 'windows-latest'
        run: |
          chmod +x ci.sh
          ./ci.sh
        shell: bash

      - name: Run PowerShell script
        if: matrix.os == 'windows-latest'
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./ci.ps1
        shell: pwsh
