name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show cmake & ctest versions
        if: matrix.os != 'windows-latest'
        run: |
          cmake --version || true
          ctest --version || true
        shell: bash

      - name: Show cmake & ctest versions (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cmake --version || true
          ctest --version || true
        shell: pwsh

      - name: Run POSIX script
        if: matrix.os != 'windows-latest'
        run: |
          chmod +x ci.sh
          ./ci.sh
        shell: bash

      - name: Run PowerShell script
        if: matrix.os == 'windows-latest'
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./ci.ps1
        shell: pwsh
