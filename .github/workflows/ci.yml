name: Cross-platform CI

on:
  push:
    branches:
      - '*develop*'
      - '*master*'
  pull_request:
    branches:
      - '*develop*'
      - '*master*'

jobs:
  cross_build:
    name: Cross-build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CMake (cross-platform)
        uses: actions/setup-cmake@v4

      - name: Make Linux/macOS script executable
        if: runner.os != 'Windows'
        run: chmod +x ./ci.sh
        shell: bash

      - name: Configure and build (Windows - Visual Studio)
        if: runner.os == 'Windows'
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64
          cmake --build . --config Release
          ctest -C Release --output-on-failure
        shell: powershell

      - name: Configure and build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./ci.sh
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: build/**
